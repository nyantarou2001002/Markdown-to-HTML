<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Markdown to HTML Converter</h1>

    <div class="flex flex-col lg:flex-row gap-4 mb-6">
        <!-- エディタエリア -->
        <div id="editor" class="h-96 w-full lg:w-1/2 bg-white border border-gray-300 shadow-md rounded-md"></div>

        <!-- プレビューエリア -->
        <div id="preview" class="h-96 w-full lg:w-1/2 bg-white border border-gray-300 shadow-md rounded-md overflow-auto p-4"></div>
    </div>

    <!-- 変換するためのフォーム -->
    <form action="convert.php" method="post" id="markdownForm" class="flex flex-col items-center">
        <label for="outputType" class="mb-2 text-gray-700">出力形式を選択してください:</label>
        <select name="outputType" id="outputType" class="mb-4 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="download">HTML をダウンロード</option>
            <option value="display">HTML を表示</option>
        </select>
        <button type="submit" onclick="submitForm()" class="px-4 py-2 bg-indigo-600 text-white rounded-md shadow hover:bg-indigo-700">
            変換
        </button>
    </form>

    <!-- CDN から Monaco Editor を読み込む -->
    <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Monaco Editor の設定と読み込み
            require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@latest/min/vs' }});

            require(['vs/editor/editor.main'], function() {
                // Monaco Editor のインスタンスを作成
                window.editor = monaco.editor.create(document.getElementById('editor'), {
                    value: '# ここに Markdown を入力してください\n', // 初期テキスト
                    language: 'markdown',   // 言語モードを Markdown に設定
                    theme: 'vs-dark'        // ダークテーマを使用
                });

                // エディタの内容が変更されたときにプレビューを更新
                window.editor.onDidChangeModelContent(function() {
                    updatePreview();
                });

                // 初期表示のプレビューを更新
                updatePreview();
            });

            // シンプルな Markdown から HTML への変換関数
            function simpleMarkdownToHTML(markdown) {
                let html = markdown;

                // 見出し (例: ## 見出し)
                html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

                // リスト (例: - アイテム)
                html = html.replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>');

                // 強調 (太字と斜体)
                html = html.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
                html = html.replace(/\*(.*)\*/gim, '<em>$1</em>');

                // コードブロック (例: `コード`)
                html = html.replace(/`(.*?)`/gim, '<code>$1</code>');

                // 改行を <br> に変換
                html = html.replace(/\n/gim, '<br>');

                return html.trim();  // 最終的に余計な空白を削除
            }

            // プレビューを更新する関数
            function updatePreview() {
                const markdownText = window.editor.getValue();
                const html = simpleMarkdownToHTML(markdownText);  // Markdown を HTML に変換
                document.getElementById('preview').innerHTML = html;  // 変換結果をプレビューに反映
            }

            // フォーム送信時にエディタの内容を取得して送信する
            window.submitForm = function() {
                const markdownText = window.editor.getValue();  // Monaco Editor の内容を取得
                const form = document.getElementById('markdownForm');
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'markdown';
                hiddenInput.value = markdownText;
                form.appendChild(hiddenInput);  // エディタ内容をフォームに追加
            }
        });
    </script>

</body>
</html>
